<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Armários do Laboratório NEON</title>
<meta name="description" content="Modelo 3D dos armários do laboratório da equipe NEON, ligado à planilha de estoque.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nova+Round&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a cena 3D ocupa a esquerda; o painel à direita mostra a lista da gaveta. No celular o painel fica embaixo da cena. */
:root{
  --bg:#e9ece8; --surface:#f7f8f6; --surface-2:#dfe3dd; --text:#18201a; --muted:#5a655c; --border:#c9cfc6;
  --accent:#4f8f2c; --accent-ink:#ffffff; --accent-soft:#dcebd1;
  /* móveis de laminado creme com perfis de alumínio, como os do laboratório */
  --body:#ece8dc; --body-dark:#8a9198; --body-in:#d6d2c6; --shelf:#e3dfd3;
  --bench-light:#efede6; --bench-dark:#3a3e43; --plastic:#2a2d30; --handle-red:#c8312b;
  --wall:#d3d8d1; --floor:#bfc5bc; --grid:#a9b0a6;
  --hl:#7fbf4d; --sel:#4f8f2c;
  --warn:#8a5a00; --warn-soft:#f8ecc9; --bad:#b33a2e; --bad-soft:#f7e1dd;
  --f-display:"Nova Round","Barlow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1a1f1c; --surface-2:#232a25; --text:#e4e9e4; --muted:#98a39a; --border:#313a33;
    --accent:#86c95a; --accent-ink:#0f1a0a; --accent-soft:#223419;
    --body:#9b998f; --body-dark:#5c6268; --body-in:#76746b; --shelf:#868478;
    --bench-light:#a9a79e; --bench-dark:#25282c; --plastic:#1b1d1f; --handle-red:#a8322b;
    --wall:#262c29; --floor:#1d2320; --grid:#2c3530;
    --hl:#86c95a; --sel:#a6e07c;
    --warn:#e3b341; --warn-soft:#33290f; --bad:#f08a7e; --bad-soft:#3a1d19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a1f1c; --surface-2:#232a25; --text:#e4e9e4; --muted:#98a39a; --border:#313a33;
  --accent:#86c95a; --accent-ink:#0f1a0a; --accent-soft:#223419;
  --body:#9b998f; --body-dark:#5c6268; --body-in:#76746b; --shelf:#868478;
  --bench-light:#a9a79e; --bench-dark:#25282c; --plastic:#1b1d1f; --handle-red:#a8322b;
  --wall:#262c29; --floor:#1d2320; --grid:#2c3530;
  --hl:#86c95a; --sel:#a6e07c;
  --warn:#e3b341; --warn-soft:#33290f; --bad:#f08a7e; --bad-soft:#3a1d19;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--border);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font:400 22px/1.1 var(--f-display);letter-spacing:.02em}
.brand span{color:var(--muted);font-size:13px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:2px 4px;border-radius:4px;color:var(--accent);cursor:pointer;font-weight:600}
.crumbs b{color:var(--text);font-weight:600}
.search{margin-left:auto;position:relative;width:min(320px,100%)}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:8px;
  box-shadow:0 8px 24px rgb(0 0 0 / .18);max-height:320px;overflow:auto;padding:4px}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--accent-soft)}
.results .none{padding:10px;color:var(--muted);font-size:14px}

.stage{position:relative;min-height:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.pointing{cursor:pointer}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font:600 12px/1 var(--f-mono);padding:4px 6px;border-radius:5px;
  background:var(--surface);color:var(--text);border:1px solid var(--border);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.lbl.cab{font:400 15px/1 var(--f-display);padding:5px 8px;text-align:center}
.lbl.cab small{display:block;font:500 11px/1.2 var(--f-body);color:var(--muted);margin-top:3px}
.lbl.cab.on{z-index:2;border-color:var(--accent)}
.lbl .n{color:var(--accent)}
.lbl.bin{font-size:11px;padding:2px 5px}
.lbl.full{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.lbl.full .n{color:inherit}
.lbl.on{outline:2px solid var(--sel);outline-offset:1px}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;font-size:13px;color:var(--muted);background:var(--surface);
  border:1px solid var(--border);border-radius:6px;padding:5px 9px;pointer-events:none;max-width:calc(100% - 140px)}
.view-btns{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.view-btns button{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
.close-cab{position:absolute;top:12px;right:12px;z-index:5;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgb(0 0 0 / .2)}
.close-cab:hover{filter:brightness(1.06)}
.close-cab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}

.sheet{border-left:1px solid var(--border);background:var(--surface);min-height:0;overflow:auto;
  padding-block:16px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet h2{margin:0;font:400 20px/1.2 var(--f-display);text-wrap:balance}
.sheet h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sheet p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.code{font:700 13px/1 var(--f-mono);background:var(--accent-soft);color:var(--accent);padding:4px 7px;border-radius:5px;letter-spacing:.02em}

.cablist{display:grid;gap:8px}
.cabrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer;text-align:left;width:100%}
.cabrow:hover{border-color:var(--accent)}
.cabrow .num{font:400 20px/1 var(--f-display);width:34px;height:34px;display:grid;place-items:center;border-radius:6px;background:var(--body);color:#18201a;border:1px solid var(--body-dark)}
.cabrow .num.box{background:var(--plastic);color:#f1f1ec;border-color:transparent}
.cabrow .cnt{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}

.front{display:grid;gap:4px;padding:6px;background:var(--body);border-radius:6px;border:1px solid var(--body-dark)}
.front.box{background:var(--plastic);border-color:var(--plastic)}
.front .lv{display:grid;gap:4px}
.front button{min-height:38px;border:1px solid var(--body-dark);background:var(--surface);border-radius:4px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 7px;font:600 12px/1 var(--f-mono);min-width:0}
.front button.drawer{background:var(--surface-2)}
.front button .c{font:500 12px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.front button.has .c{color:var(--accent);font-weight:700}
.front button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.front button.on .c{color:inherit}
.bins{display:flex;gap:4px;background:var(--plastic);border-color:var(--plastic)}
.bins .bcol{flex:1 1 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.bins .gap{flex:1 1 0}
.bins button{flex:1 1 0;min-height:0;flex-direction:column;align-items:stretch;justify-content:center;gap:3px;overflow:hidden}
.bins button .r1{display:flex;justify-content:space-between;gap:4px}
.bins button .et{font:500 11px/1.2 var(--f-body);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bins button .et.none{color:var(--muted)}
.seen{margin:0;padding-left:18px;display:grid;gap:2px}
.seen button{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:left;text-decoration:underline}

.items{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.item{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--bg);display:grid;gap:4px}
.item .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .qty{font:700 15px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.chip{padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.empty{border:1px dashed var(--border);border-radius:8px;padding:16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}

.btn{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--warn-soft);color:var(--warn);display:grid;gap:6px}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.loose{border-top:1px solid var(--border);padding-top:12px;display:grid;gap:8px}
.foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px;display:grid;gap:8px}
.steps{margin:0;padding-left:20px;display:grid;gap:4px}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 56vh auto;height:auto;min-height:100%}
  html,body{height:auto}
  .sheet{border-left:0;border-top:1px solid var(--border);overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .search{width:100%;margin-left:0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Armários NEON</h1><span>laboratório</span></div>
    <nav class="crumbs" id="crumbs" aria-label="Onde você está"></nav>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Buscar item (ex.: XT60)" autocomplete="off" aria-label="Buscar item">
      <div class="results" id="results" hidden></div>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="scene" aria-label="Modelo 3D dos armários do laboratório"></canvas>
    <div class="labels" id="labels"></div>
    <div class="hint" id="hint">Arraste para girar · role para aproximar · clique num armário</div>
    <button class="close-cab" id="closeCab" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg><span>Fechar armário</span></button>
    <div class="view-btns"><button id="resetView" type="button">Centralizar</button></div>
  </main>

  <aside class="sheet" id="sheet" aria-live="polite"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="laboratorio.js"></script>
<script>
(() => {
'use strict';

// ---------- planilha ----------
// Os móveis vêm de laboratorio.js. Da planilha o site só lê o estoque; para cadastrar ou mudar um item, a equipe edita direto no Google Planilhas.
const PLANILHA_ID = '1M1xmuR2K5_a9YNmupEMKDZzq84BJT-YrPX181cKO5Kw';
const PLANILHA_URL = 'https://docs.google.com/spreadsheets/d/' + PLANILHA_ID + '/edit';
const ABA_ESTOQUE = 'Estoque';
const ATUALIZA_MS = 60 * 1000;

// ---------- state ----------
const S = {
  cabs: [],            // [{id, key, numero, nome, tipo, forma, rodinhas, maleta, x, y, z, rot, w, h, d, niveis:[{tipo, div, tam, nome}], dentro:{code:[objeto]}}]
  bancadas: [],        // [{nome, x, z, rot, w, h, d, escuro}]
  items: [],           // [{id, cab, armario, local, item, espec, qtd, unid, classificacao, categoria, estado, origem, obs, conferido}]
  loaded: false,       // o estoque já foi lido pelo menos uma vez
  erro: null,          // null | 'privada' | 'rede'
  lidoEm: null,
  itemsSig: '',
  view: 'lab',        // 'lab' | 'cab'
  cabId: null,
  slot: null,          // compartment code inside the open cabinet, e.g. "G6A", "P3B", "C12A" or the bin "P3D-4"
};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const txt = v => String(v ?? '').trim();
const num = (v, d) => { if (typeof v === 'number') return v; const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : d; };
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const LADOS = { 2: ['esquerda', 'direita'], 3: ['esquerda', 'meio', 'direita'] };

// Compartment codes carry the unit's number, so each one is unique in the lab: P for shelves, G for drawers and
// C for box compartments, then the unit number and a letter counted in reading order, top to bottom and left to
// right (back to front in a box). Armário 3 has P3A, P3B, P3C and P3D; a unit with a single one has no letter (C9).
// Bins stacked inside a compartment add a number: P3C-1, P3C-2…
const PREFIXO = { prateleira: 'P', gaveta: 'G', compartimento: 'C' };
const NOME_NIVEL = { prateleira: 'Prateleira ', gaveta: 'Gaveta ', compartimento: 'Compartimento ' };
function slotsOf(cab) {
  const out = [], niveis = { prateleira: 0, gaveta: 0, compartimento: 0 }, cont = { prateleira: 0, gaveta: 0, compartimento: 0 }, total = {};
  (cab.niveis || []).forEach(lv => { total[lv.tipo] = (total[lv.tipo] || 0) + lv.div; });
  (cab.niveis || []).forEach((lv, li) => {
    const n = ++niveis[lv.tipo], base = lv.nome || NOME_NIVEL[lv.tipo] + n;
    for (let c = 0; c < lv.div; c++) {
      const k = cont[lv.tipo]++;
      const code = PREFIXO[lv.tipo] + cab.numero + (total[lv.tipo] > 1 ? LETTERS[k] : '');
      const label = base + (lv.div > 1 ? ', ' + (LADOS[lv.div] && cab.forma !== 'caixa' ? LADOS[lv.div][c] : 'divisão ' + (c + 1)) : '');
      out.push({ code, level: li, col: c, div: lv.div, tipo: lv.tipo, label });
      recipientes(cab, code).forEach(r => {
        if (r.cesto) out.push({ code: r.cesto.code, parent: code, level: li, col: c, tipo: 'cesto', etiqueta: r.o.etiqueta, short: r.o.nome || 'Cesto ' + r.cesto.n,
          label: label + ' · ' + (r.o.nome || 'cesto ' + r.cesto.n).toLowerCase(), conteudo: r.o.conteudo.map(x => x.nome).filter(Boolean) });
        else if (r.colunas) r.colunas.forEach(col => col.forEach(b => {
          if (b) out.push({ code: b.code, parent: code, level: li, col: c, tipo: 'caixinha', etiqueta: b.etiqueta, short: 'Caixinha ' + b.n, label: label + ' · caixinha ' + b.n });
        }));
      });
    }
  });
  return out;
}
// What sits in a compartment, in order. Bins and baskets are compartments of their own, numbered in that order:
// the bins of a stack column by column (from the left), top to bottom.
function recipientes(cab, bay) {
  let k = 0;
  return ((cab.dentro || {})[bay] || []).map(o => {
    if (o.obj === 'caixinhas') return { o, colunas: o.colunas.map(col => col.map(et => et === null ? null : { code: bay + '-' + (++k), n: k, etiqueta: et })) };
    if (o.obj === 'cesto') return { o, cesto: { code: bay + '-' + (++k), n: k } };
    return { o };
  });
}
const caixinhas = (cab, bay) => recipientes(cab, bay).filter(r => r.colunas);
const baia = code => String(code || '').split('-')[0];
const cabById = id => S.cabs.find(c => c.id === id);
// a compartment's items include the ones in its bins
const itemsIn = (cabId, code) => S.items.filter(i => i.cab === cabId && (code == null || i.local === code || i.local.startsWith(code + '-')));
const cabName = c => c.nome ? c.id + ' · ' + c.nome : c.id;
// the compartment code already names the unit; a unit on its own is A3
const fullCode = (c, code) => code || 'A' + c.numero;
const itensTxt = n => n + (n === 1 ? ' item' : ' itens');

// ---------- móveis (laboratorio.js) ----------
// "Armário 2", "armario 2", "A2" e "2" apontam para o mesmo móvel
const chave = s => { const m = /(\d+)/.exec(String(s)); return m ? 'n' + (+m[1]) : norm(s); };
function tipoNivel(s) { const t = norm(s); return t.startsWith('g') ? 'gaveta' : t.startsWith('c') ? 'compartimento' : 'prateleira'; }
// O que fica dentro dos compartimentos, só para aparecer no modelo: caixas, cestos, frascos, pilhas de caixinhas
// e as ferramentas que um cesto espalha na bancada quando é aberto
const OBJETOS = ['caixinhas', 'caixa', 'cesto', 'cilindro', 'terceira mao', 'ferro de solda', 'suporte de ferro', 'alicate', 'pinca', 'carretel', 'escova', 'manta'];
const hex = s => /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(txt(s)) ? txt(s) : '';
function lerObjeto(o) {
  return { obj: OBJETOS.find(k => norm(o.objeto).startsWith(k)) || 'caixa', nome: txt(o.nome), rotulo: txt(o.rotulo), texto: txt(o.texto), etiqueta: txt(o.etiqueta),
    cor: hex(o.cor), cor2: hex(o.cor2), cabeca: hex(o.cabeca), tampa: hex(o.tampa), bico: norm(o.bico), forma: norm(o.forma),
    transparente: !!o.transparente, ferramentas: !!o.ferramentas, deitado: !!o.deitado, quantidade: Math.round(num(o.quantidade, 0)),
    cores: [].concat(o.cores || []).map(hex).filter(Boolean),
    w: num(o.largura, 0), h: num(o.altura, 0), d: num(o.fundo, 0), x: num(o.x, 0), y: num(o.y, 0), z: num(o.z, 0), recuo: num(o.recuo, 0), giro: num(o.giro, 0),
    colunas: [].concat(o.colunas || []).map(col => [].concat(col || []).map(e => e === null ? null : txt(e))),
    conteudo: [].concat(o.conteudo || []).map(lerObjeto) };
}
function lerDentro(d) {
  const out = {};
  Object.keys(d || {}).forEach(code => { out[code.toUpperCase().replace(/\s+/g, '')] = [].concat(d[code] || []).map(lerObjeto); });

}
function montarLab(lab) {
  const cabs = (lab.armarios || []).filter(a => txt(a.armario)).map(a => {
    const id = txt(a.armario), m = /(\d+)/.exec(id), t = norm(a.tipo);
    const forma = /caixa|maleta/.test(t) ? 'caixa' : 'movel';
    const niveis = (a.niveis || []).map(l => {
      const tipo = tipoNivel(l.tipo), tam = num(l.tamanho, 0);
      return { tipo, div: clamp(Math.round(num(l.divisoes, 1)) || 1, 1, 6), tam: tam > 0 ? tam : tipo === 'gaveta' ? 0.6 : 1, nome: txt(l.nome) };
    });
    return { id, key: chave(id), numero: m ? String(+m[1]) : id, nome: txt(a.nome), tipo: txt(a.tipo) || 'Armário', forma,
      rodinhas: /volante|rodinha/.test(t), maleta: t.includes('maleta'),
      w: clamp(num(a.largura, 0.9), 0.15, 3), h: clamp(num(a.altura, 1.9), 0.08, 3), d: clamp(num(a.fundo, 0.45), 0.1, 1.5),
      x: num(a.x, 0), z: num(a.z, 0), y: Math.max(0, num(a.altura_do_chao, 0)), rot: num(a.giro, 0),
      niveis: niveis.length ? niveis : [{ tipo: forma === 'caixa' ? 'compartimento' : 'prateleira', div: 1, tam: 1, nome: '' }],
      dentro: lerDentro(a.dentro) };
  }).sort((a, b) => (+a.numero || 0) - (+b.numero || 0));
  const bancadas = (lab.bancadas || []).map(b => ({ nome: txt(b.nome),
    w: clamp(num(b.comprimento, 2), 0.3, 20), d: clamp(num(b.fundo, 0.7), 0.2, 3), h: clamp(num(b.altura, 0.9), 0.4, 1.5),
    x: num(b.x, 0), z: num(b.z, 0), rot: num(b.giro, 0), escuro: /pret|escur/.test(norm(b.tampo)) }));
  // uma caixa embaixo de uma bancada sai para a frente antes de abrir a tampa
  const pegada = o => (Math.round(o.rot / 90) % 2) ? { w: o.d, d: o.w } : { w: o.w, d: o.d };
  cabs.forEach(c => {
    if (c.forma !== 'caixa') return;
    c.sobBancada = bancadas.some(b => { const p = pegada(b);
      return Math.abs(c.x - b.x) < p.w / 2 && Math.abs(c.z - b.z) < p.d / 2 && b.h > c.y + c.h && c.y < b.h - 0.1; });

}

// Footprint of everything in the lab, rotation-agnostic
function extents() {
  const all = S.cabs.concat(S.bancadas);
  if (!all.length) return { minX: -2, maxX: 2, minZ: -1, maxZ: 1 };
  const b = { minX: Infinity, maxX: -Infinity, minZ: Infinity, maxZ: -Infinity };
  all.forEach(o => { const r = (Math.round(o.rot / 90) % 2) ? [o.d / 2, o.w / 2] : [o.w / 2, o.d / 2];
    b.minX = Math.min(b.minX, o.x - r[0]); b.maxX = Math.max(b.maxX, o.x + r[0]); b.minZ = Math.min(b.minZ, o.z - r[1]); b.maxZ = Math.max(b.maxZ, o.z + r[1]); });
  return b;
}

function buildRoom() {
  extras.forEach(o => scene.remove(o)); extras = [];
  const b = extents();
  const cx = (b.minX + b.maxX) / 2, cz = (b.minZ + b.maxZ) / 2;
  const w = b.maxX - b.minX + 4, d = b.maxZ - b.minZ + 5;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ color: col('--floor'), roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(cx, 0, b.minZ + d / 2 - 0.5); floor.receiveShadow = true;
  scene.add(floor); extras.push(floor);
  // 1 m grid, the scale reference
  const pts = [], x0 = Math.floor(cx - w / 2), x1 = Math.ceil(cx + w / 2), z0 = Math.floor(b.minZ), z1 = Math.ceil(b.minZ + d - 0.5);
  for (let x = x0; x <= x1; x++) pts.push(x, 0.002, z0, x, 0.002, z1);
  for (let z = z0; z <= z1; z++) pts.push(x0, 0.002, z, x1, 0.002, z);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const grid = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: col('--grid') }));
  scene.add(grid); extras.push(grid);
  // the wall behind the furniture, visible only from the front, so it vanishes when the camera goes behind it
  const atWall = S.cabs.concat(S.bancadas).filter(o => !(Math.round(o.rot) % 360));
  if (atWall.length) {
    const wz = Math.min(...atWall.map(o => o.z - o.d / 2));
    const wx0 = Math.min(...atWall.map(o => o.x - o.w / 2)) - 0.5, wx1 = Math.max(...atWall.map(o => o.x + o.w / 2)) + 0.5;
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(wx1 - wx0, 3), new THREE.MeshStandardMaterial({ color: col('--wall'), roughness: 0.95 }));
    wall.position.set((wx0 + wx1) / 2, 1.5, wz - 0.002);
    scene.add(wall); extras.push(wall);
  }
  S.bancadas.forEach(bc => { const o = buildBench(bc); scene.add(o); extras.push(o); });
  sun.position.set(cx + 3, 8, cz + 7); sun.target.position.set(cx, 0, cz);
}

// Each cabinet gets its own materials, so highlighting one does not tint the others.
function mats() {
  const std = (v, o) => new THREE.MeshStandardMaterial(Object.assign({ color: col(v), roughness: 0.7, metalness: 0 }, o));
  return {
    body: std('--body', { roughness: 0.6 }), inner: std('--body-in', { roughness: 0.85 }), shelf: std('--shelf'),
    metal: std('--body-dark', { metalness: 0.55, roughness: 0.4 }), plastic: std('--plastic', { roughness: 0.5 }), red: std('--handle-red', { roughness: 0.5 }),
  };
}
const hitMat = () => new THREE.MeshBasicMaterial({ color: col('--hl'), transparent: true, opacity: 0, depthWrite: false });

function box(w, h, d, m) { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.castShadow = true; o.receiveShadow = true; return o; }

function buildBench(b) {
  const g = new THREE.Group();
  g.position.set(b.x, 0, b.z); g.rotation.y = b.rot * Math.PI / 180;
  const top = box(b.w, 0.03, b.d, new THREE.MeshStandardMaterial({ color: col(b.escuro ? '--bench-dark' : '--bench-light'), roughness: b.escuro ? 0.9 : 0.6 }));
  top.position.set(0, b.h - 0.015, 0); g.add(top);
  // legs at both ends; where a cabinet sits at the end they end up hidden inside it
  const metal = new THREE.MeshStandardMaterial({ color: col('--body-dark'), metalness: 0.55, roughness: 0.4 });
  [-1, 1].forEach(s => [-b.d / 2 + 0.06, b.d / 2 - 0.15].forEach(z => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, b.h - 0.03, 10), metal);
    leg.position.set(s * (b.w / 2 - 0.04), (b.h - 0.03) / 2, z); g.add(leg);
  }));
  return g;
}

function buildCabinet(c, M) {
  const g = new THREE.Group();
  g.position.set(c.x, c.y, c.z);
  g.rotation.y = (c.rot || 0) * Math.PI / 180;
  const parts = c.forma === 'caixa' ? buildBox(c, M, g) : buildFurniture(c, M, g);
  const glow = [];
  g.traverse(o => { if (!o.isMesh) return; if (!o.userData.cabId) o.userData.cabId = c.id; if (o.material.emissive) glow.push(o.material); });
  scene.add(g);
  const comCaixinhas = new Set([...parts.slots.values()].filter(s => s.parent).map(s => s.parent));
  return Object.assign({ group: g, glow: [...new Set(glow)], comCaixinhas }, parts);
}

// Armário, armário de parede e gaveteiro: caixa de laminado com portas na frente das prateleiras
function buildFurniture(c, M, g) {
  const { w, h, d } = c, t = 0.018;
  const base = c.y > 0 ? 0 : c.rodinhas ? 0.06 : 0.12;     // nada na parede, rodinhas no volante, pés de metal no chão
  const add = (o, x, y, z) => { o.position.set(x, y, z); g.add(o); return o; };
  const bh = h - base, by = base + bh / 2;
  add(box(w, bh, t, M.inner), 0, by, -d / 2 + t / 2);       // back
  add(box(t, bh, d, M.body), -w / 2 + t / 2, by, 0);        // left
  add(box(t, bh, d, M.body), w / 2 - t / 2, by, 0);         // right
  add(box(w, t, d, M.body), 0, h - t / 2, 0);               // top
  add(box(w, t, d, M.body), 0, base + t / 2, 0);            // bottom
  if (base) {
    const ix = w / 2 - 0.05, iz = d / 2 - 0.06;
    [[-ix, -iz], [ix, -iz], [-ix, iz], [ix, iz]].forEach(([x, z]) => {
      const foot = c.rodinhas
        ? new THREE.Mesh(new THREE.CylinderGeometry(base / 2, base / 2, 0.025, 14).rotateZ(Math.PI / 2), M.plastic)
        : new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, base, 10), M.metal);
      add(foot, x, base / 2, z);
    });
  }

  // Interior: levels share the inner height by their size
  const lv = c.niveis;
  const temPortas = lv.some(l => l.tipo !== 'gaveta');
  const innerTop = h - t, innerBot = base + t, innerW = w - 2 * t;
  const sum = lv.reduce((a, l) => a + l.tam, 0) || 1;
  const frontZ = temPortas ? d / 2 - 0.035 : d / 2 + 0.01;  // drawer fronts sit behind the doors, or flush in a drawer unit
  const slots = new Map(), codes = slotsOf(c).filter(s => !s.parent);   // bins are built with their compartment
  let y = innerTop;
  lv.forEach((l, li) => {
    const lh = (innerTop - innerBot) * l.tam / sum;
    const y0 = y - lh; y = y0;
    if (li < lv.length - 1) add(box(innerW, 0.015, d - 0.04, M.shelf), 0, y0 + 0.0075, 0);
    const cw = innerW / l.div;
    if (l.tipo !== 'gaveta') for (let k = 1; k < l.div; k++) add(box(0.016, lh - 0.015, d - 0.06, M.shelf), -innerW / 2 + k * cw, y0 + lh / 2, 0);
    codes.filter(s => s.level === li).forEach(s => {
      const cx = -innerW / 2 + cw * (s.col + 0.5), cy = y0 + lh / 2;
      let mesh, drawer = null, lbl;
      if (l.tipo === 'gaveta') {
        drawer = new THREE.Group();
        const fw = cw - 0.006, fh = lh - 0.008, trayD = d - 0.1;
        const front = box(fw, fh, 0.02, new THREE.MeshStandardMaterial({ color: col('--body'), roughness: 0.6 }));
        front.position.set(0, 0, frontZ);
        const tray = box(fw - 0.03, fh * 0.7, trayD, M.inner); tray.position.set(0, -fh * 0.12, frontZ - 0.012 - trayD / 2);
        const pull = box(fw, 0.022, 0.014, M.metal); pull.position.set(0, fh / 2 - 0.016, frontZ + 0.016);   // aluminium strip along the top
        drawer.add(front, tray, pull);
        [front, tray, pull].forEach(o => { o.userData = { cabId: c.id, slot: s.code }; });
        drawer.position.set(cx, cy, 0);
        g.add(drawer);
        mesh = front;
        lbl = new THREE.Vector3(cx, cy, frontZ + 0.03);
      } else {
        // invisible hit volume filling the shelf bay, tinted when hovered or selected
        mesh = new THREE.Mesh(new THREE.BoxGeometry(cw - 0.03, lh - 0.03, d - 0.08), hitMat());
        mesh.position.set(cx, cy + 0.008, 0.01);
        mesh.userData = { cabId: c.id, slot: s.code };
        mesh.userData.cheio = !!(c.dentro || {})[s.code];   // with things inside, the tint stays light so they show through
        g.add(mesh);
        lbl = new THREE.Vector3(cx, cy, d / 2 - 0.05);
      }
      slots.set(s.code, { mesh, drawer, tipo: l.tipo, lbl, goalZ: 0, pull: d * 0.55 });
      // the free space of the bay: between the dividers, from the shelf below to the one above, from the back to behind the doors
      if (!drawer) buildDentro(c, s.code, { x0: cx - cw / 2 + (s.col > 0 ? 0.008 : 0), x1: cx + cw / 2 - (s.col < l.div - 1 ? 0.008 : 0),
        y0: y0 + (li < lv.length - 1 ? 0.015 : 0), y1: y0 + lh, z0: -d / 2 + t, z1: d / 2 - 0.02 }, g, slots, M);
    });
  });

  // Doors in front of the shelves: two leaves hinged on the outer edges, or one on narrow cabinets
  const doors = [];
  if (temPortas) {
    const n = w >= 0.55 ? 2 : 1, leafW = w / n - 0.004, leafH = h - base - 0.01;
    (n === 2 ? [-1, 1] : [-1]).forEach((side, i) => {
      const pivot = new THREE.Group();
      pivot.position.set(side * w / 2, base + (h - base) / 2, d / 2 + 0.012);
      const leaf = box(leafW, leafH, 0.02, M.body); leaf.position.set(-side * leafW / 2, 0, 0);
      // aluminium pull: full-height strip on the meeting edge of wall cabinets, a strip along the top on the lower ones
      const pull = c.y > 0 ? box(0.03, leafH, 0.016, M.metal) : box(leafW, 0.022, 0.016, M.metal);
      if (c.y > 0) pull.position.set(-side * (leafW - 0.015), 0, 0.018); else pull.position.set(-side * leafW / 2, leafH / 2 - 0.016, 0.018);
      pivot.add(leaf, pull);
      if (i === n - 1) {
        const lock = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.009, 0.012, 12).rotateX(Math.PI / 2), M.metal);
        lock.position.set(-side * (leafW - (c.y > 0 ? 0.06 : 0.04)), c.y > 0 ? -leafH / 2 + 0.07 : leafH / 2 - 0.07, 0.014);
        pivot.add(lock);
      }
      g.add(pivot);
      doors.push({ pivot, axis: 'y', open: side * 1.62, cur: 0, goal: 0 });   // a bit past 90°, so they clear the neighbours
    });
  }
  return { doors, slots, slide: null };
}

// ---------- o que tem dentro (laboratorio.js, "dentro") ----------
const material = (cor, o) => new THREE.MeshStandardMaterial(Object.assign({ color: new THREE.Color(cor), roughness: 0.7 }, o));
const vidro = cor => new THREE.MeshStandardMaterial({ color: cor ? new THREE.Color(cor) : 0xdfe8ec, transparent: true, opacity: cor ? 0.6 : 0.32, roughness: 0.15, depthWrite: false });
const tintaPara = cor => new THREE.Color(cor).getHSL({}).l > 0.6 ? '#1d1f22' : '#f4f4f0';

// Texto impresso numa face: a frente de uma caixa de produto ou a etiqueta de uma caixinha. A primeira linha sai maior.
function textoTex(texto, fundo, tinta, w, h) {
  const W = 512, H = clamp(Math.round(W * h / w), 48, 1024);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  x.fillStyle = fundo; x.fillRect(0, 0, W, H);
  const ls = texto.split('\n'), pesos = ls.map((_, i) => i ? 0.62 : 1), soma = pesos.reduce((a, b) => a + b, 0);
  const base = Math.min(H * 0.8 / (soma * 1.25), W * 0.28);
  let y = (H - base * soma * 1.25) / 2;
  x.fillStyle = tinta; x.textAlign = 'center'; x.textBaseline = 'middle';
  ls.forEach((l, i) => {
    let f = base * pesos[i]; const lh = f * 1.25;
    do { x.font = '700 ' + f + 'px Arial, sans-serif'; f -= 2; } while (f > 8 && x.measureText(l).width > W * 0.9);
    x.fillText(l, W / 2, y + lh / 2); y += lh;
  });
  const t = new THREE.CanvasTexture(cv); t.anisotropy = 4; return t;
}
function etiqueta(parent, texto, w, h, x, y, z) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ color: 0xf2f2ee, roughness: 0.9,
    map: texto ? textoTex(texto, '#f2f2ee', '#1d1f22', w, h) : null }));
  m.position.set(x, y, z); parent.add(m); return m;
}

// B is the free space of the bay, in the cabinet's coordinates
function buildDentro(c, bay, B, g, slots, M) {
  if (!(c.dentro || {})[bay]) return;
  const W = B.x1 - B.x0, H = B.y1 - B.y0, D = B.z1 - B.z0;
  recipientes(c, bay).forEach(r => {
    const o = r.o;
    if (r.colunas) { buildBins(c, r, B, g, slots, M); return; }
    const w = clamp(o.w || 0.1, 0.01, W), h = clamp(o.h || 0.1, 0.01, H), d = clamp(o.d || Math.min(w, D), 0.01, D);
    const obj = buildObjeto(o, w, h, d);
    obj.position.set(B.x0 + o.x + w / 2, B.y0 + o.y, B.z1 - o.recuo - d / 2);
    // clicking a thing in the bay selects the bay; a basket is a compartment of its own
    const slot = r.cesto ? r.cesto.code : bay;
    obj.traverse(m => { if (m.isMesh) { m.userData = { cabId: c.id, slot }; m.castShadow = m.receiveShadow = !m.material.transparent; } });
    g.add(obj);
    if (r.cesto) {
      const hitBox = new THREE.Mesh(new THREE.BoxGeometry(w + 0.01, h + 0.01, d + 0.01), hitMat());
      hitBox.position.y = h / 2; hitBox.userData = { cabId: c.id, slot }; obj.add(hitBox);
      slots.set(slot, { mesh: hitBox, drawer: null, tipo: 'cesto', parent: bay, lbl: new THREE.Vector3(0, h + 0.02, d / 2),
        ferramentas: obj.userData.ferramentas || null, mesa: o.conteudo.length ? buildMesa(c, o.conteudo, g, slot) : null });
    }
  });
}

// What a basket holds, laid out on the bench under the unit while the basket is open (on the floor in front of it
// if there is no bench). x runs from the unit's left end and z from the back of the bench, both to each thing's centre.
function buildMesa(c, itens, g, slot) {
  const mesa = new THREE.Group();
  const pegada = o => (Math.round(o.rot / 90) % 2) ? { w: o.d, d: o.w } : { w: o.w, d: o.d };
  const b = S.bancadas.find(b => { const p = pegada(b); return Math.abs(c.x - b.x) < p.w / 2 && Math.abs(c.z - b.z) < p.d / 2 + 0.3 && b.h <= c.y + 0.01; });
  g.updateMatrixWorld(true);
  mesa.position.copy(g.worldToLocal(new THREE.Vector3(c.x - c.w / 2, b ? b.h : 0, b ? b.z - pegada(b).d / 2 : c.z + c.d / 2 + 0.1)));
  mesa.rotation.y = -g.rotation.y;
  itens.forEach(o => {
    const w = o.w || 0.1, h = o.h || 0.05, d = o.d || w;
    const obj = buildObjeto(o, w, h, d);
    obj.position.set(o.x, o.y, o.z); obj.rotation.y = o.giro * Math.PI / 180;
    obj.traverse(m => { if (m.isMesh) { m.userData = { cabId: c.id, slot }; m.castShadow = true; m.receiveShadow = !m.material.transparent; } });
    if (o.rotulo) obj.userData.rotulo = { texto: o.rotulo, pos: new THREE.Vector3(o.x, o.y + (o.deitado ? o.w : o.h || 0.02) + 0.02, o.z) };
    mesa.add(obj);
  });
  mesa.visible = false;
  g.add(mesa);
  return mesa;
}

// One thing on a shelf or on the bench, standing on its base at the origin; long tools lie along x, tip or head at +x
function buildObjeto(o, w, h, d) {
  const grp = new THREE.Group();
  const put = (mesh, x, y, z) => { mesh.position.set(x, y, z); grp.add(mesh); return mesh; };
  const metal = () => material('#8e9296', { metalness: 0.7, roughness: 0.35 });
  if (o.obj === 'caixa') {
    const cor = o.cor || '#9a7b55';
    const lado = o.transparente ? vidro() : material(cor, { roughness: 0.8 });
    const frente = o.texto ? new THREE.MeshStandardMaterial({ map: textoTex(o.texto, cor, tintaPara(cor), w, h), roughness: 0.8 }) : lado;
    put(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [lado, lado, lado, lado, frente, lado]), 0, h / 2, 0);
    // what shows through a transparent box, one layer per colour, top to bottom
    const n = o.cores.length;
    o.cores.forEach((k, i) => put(new THREE.Mesh(new THREE.BoxGeometry(w * 0.8, h / n * 0.7, d * 0.8), material(k)), 0, h - h / n * (i + 0.5), 0));
  } else if (o.obj === 'cesto') {
    const m = material(o.cor || '#e8c3c7', { roughness: 0.6 }), t = 0.005;
    put(new THREE.Mesh(new THREE.BoxGeometry(w, t, d), m), 0, t / 2, 0);

// Stack of organiser bins: each bin is a compartment of its own, with the label on its front lip
function buildBins(c, grupo, B, g, slots, M) {
  if (!grupo || !grupo.colunas.length) return;
  const o = grupo.o, livreW = B.x1 - B.x0 - o.x, livreH = B.y1 - B.y0 - o.y;
  const W = clamp(o.w || livreW, 0.05, livreW), H = clamp(o.h || livreH - 0.01, 0.04, livreH), D = clamp(o.d || 0.24, 0.06, B.z1 - B.z0);
  const cw = W / grupo.colunas.length, t = 0.004;
  grupo.colunas.forEach((col, ci) => {
    const bh = H / col.length;
    col.forEach((b, ri) => {
      if (!b) return;
      const bw = cw - 0.004, hh = bh - 0.004, lip = hh * 0.42;
      const bin = new THREE.Group();
      bin.position.set(B.x0 + o.x + cw * (ci + 0.5), B.y0 + o.y + bh * (col.length - 1 - ri), B.z1 - o.recuo - D / 2);
      const add = (mesh, x, y, z) => { mesh.position.set(x, y, z); mesh.castShadow = mesh.receiveShadow = true; bin.add(mesh); return mesh; };
      add(new THREE.Mesh(new THREE.BoxGeometry(bw, t, D), M.plastic), 0, t / 2, 0);
      add(new THREE.Mesh(new THREE.BoxGeometry(bw, hh, t), M.plastic), 0, hh / 2, -D / 2 + t / 2);
      add(new THREE.Mesh(new THREE.BoxGeometry(bw, lip, t), M.plastic), 0, lip / 2, D / 2 - t / 2);
      // the sides slope from full height at the back down to the front lip; the shape is drawn in (z, y) and turned onto the x axis
      const perfil = new THREE.Shape([new THREE.Vector2(-D / 2, 0), new THREE.Vector2(D / 2, 0), new THREE.Vector2(D / 2, lip), new THREE.Vector2(-D / 2 + D * 0.4, hh), new THREE.Vector2(-D / 2, hh)]);
      const lado = new THREE.ExtrudeGeometry(perfil, { depth: t, bevelEnabled: false }).rotateY(-Math.PI / 2);
      add(new THREE.Mesh(lado, M.plastic), -bw / 2 + t, 0, 0);
      add(new THREE.Mesh(lado, M.plastic), bw / 2, 0, 0);
      etiqueta(bin, b.etiqueta, bw * 0.66, lip * 0.5, 0, lip * 0.5, D / 2 + 0.0015);
      const hitBox = new THREE.Mesh(new THREE.BoxGeometry(bw, hh, D), hitMat());
      hitBox.position.set(0, hh / 2, 0); bin.add(hitBox);
      bin.traverse(m => { if (m.isMesh) m.userData = { cabId: c.id, slot: b.code }; });
      g.add(bin);

      slots.set(b.code, { mesh: hitBox, drawer: null, tipo: 'caixinha', parent: baia(b.code), lbl: new THREE.Vector3(-bw / 2 + 0.018, lip + 0.008, D / 2) });
    });
  });
}

// Caixa e maleta: base de plástico com tampa; os compartimentos ficam em fileiras, do fundo para a frente
function buildBox(c, M, g) {
  const { w, h, d } = c, t = 0.012;
  const inner = new THREE.Group(); g.add(inner);   // slides out from under a bench before the lid opens
  const add = (o, x, y, z) => { o.position.set(x, y, z); inner.add(o); return o; };
  const lidH = c.maleta ? Math.min(0.05, h * 0.3) : 0.035, bh = h - lidH;
  add(box(w, t, d, M.plastic), 0, t / 2, 0);
  add(box(w, bh, t, M.plastic), 0, bh / 2, -d / 2 + t / 2);
  add(box(w, bh, t, M.plastic), 0, bh / 2, d / 2 - t / 2);
  add(box(t, bh, d, M.plastic), -w / 2 + t / 2, bh / 2, 0);
  add(box(t, bh, d, M.plastic), w / 2 - t / 2, bh / 2, 0);
  if (c.maleta) add(box(Math.min(0.13, w * 0.3), 0.022, 0.03, M.metal), 0, bh - 0.025, d / 2 + 0.015);   // carrying handle
  else add(box(Math.min(0.16, w * 0.35), 0.03, 0.035, M.red), 0, bh - 0.06, d / 2 + 0.017);              // red handle

  const pivot = new THREE.Group(); pivot.position.set(0, bh, -d / 2); inner.add(pivot);
  const lid = box(w + 0.008, lidH, d + 0.008, M.plastic); lid.position.set(0, lidH / 2, d / 2); pivot.add(lid);
  const doors = [{ pivot, axis: 'x', open: c.maleta ? -1.75 : -1.9, cur: 0, goal: 0 }];

  const lv = c.niveis, innerW = w - 2 * t, innerD = d - 2 * t, innerH = bh - t;

  const slots = new Map(), codes = slotsOf(c).filter(s => !s.parent);   // bins are built with their compartment

  lv.forEach((l, li) => {
    const rd = innerD * l.tam / sum, z0 = z; z += rd;
    if (li > 0) add(box(innerW, innerH * 0.8, 0.006, M.plastic), 0, t + innerH * 0.4, z0);

    codes.filter(s => s.level === li).forEach(s => {

}

function rebuildScene() {
  if (!renderer) return;
  cabGroups.forEach(v => scene.remove(v.group));
  cabGroups.clear();
  S.cabs.forEach(c => cabGroups.set(c.id, buildCabinet(c, mats())));
  buildRoom();
  applyOpenState(true);
  paintSlots();
}

function applyOpenState(instant) {
  cabGroups.forEach((v, id) => {
    const open = S.view === 'cab' && S.cabId === id;
    v.doors.forEach(dr => { dr.goal = open ? dr.open : 0; if (instant || REDUCED) { dr.cur = dr.goal; dr.pivot.rotation[dr.axis] = dr.cur; } });
    v.slots.forEach((s, code) => { if (s.drawer) { s.goalZ = (open && S.slot === code) ? s.pull : 0; if (instant || REDUCED) s.drawer.position.z = s.goalZ; } });
    // an open basket spreads its tools on the bench, and its handles stop sticking out of it
    v.slots.forEach((s, code) => { if (s.mesa) { s.mesa.visible = open && S.slot === code; if (s.ferramentas) s.ferramentas.visible = !s.mesa.visible; } });
    if (v.slide) { v.slide.goal = open ? v.slide.dist : 0; if (instant || REDUCED) { v.slide.cur = v.slide.goal; v.slide.obj.position.z = v.slide.cur; } }
  });
}

let hovered = null; // {cabId, slot}
function paintSlots() {
  cabGroups.forEach((v, id) => {
    const isOpen = S.view === 'cab' && S.cabId === id;
    v.slots.forEach((s, code) => {
      const on = isOpen && S.slot === code, hov = hovered && hovered.cabId === id && hovered.slot === code && isOpen;
      if (s.drawer) {
        s.mesh.material.color.copy(on ? col('--sel') : hov ? col('--hl') : col('--body'));
      } else {
        s.mesh.material.color.copy(on ? col('--sel') : col('--hl'));
        s.mesh.material.opacity = (on ? 0.4 : hov ? 0.24 : 0) * (s.mesh.userData.cheio ? 0.35 : 1);
      }
    });
    const hl = S.view === 'lab' && hovered && hovered.cabId === id;
    v.glow.forEach(m => { m.emissive.set(hl ? css('--hl') : '#000000'); m.emissiveIntensity = hl ? 0.2 : 0; });
  });
}

function resize() {
  if (!renderer) return;
  const r = $('#stage').getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height);
  camera.updateProjectionMatrix();
}

// Camera framing
function goalForLab() {
  const b = extents();
  const cx = (b.minX + b.maxX) / 2, cz = (b.minZ + b.maxZ) / 2;
  const tn = Math.tan((camera ? camera.fov : 40) * Math.PI / 360), aspect = camera ? camera.aspect : 1.5;
  const needH = ((b.maxX - b.minX) / 2 + 0.5) / (tn * aspect), needV = 1.7 / tn;
  return { target: new THREE.Vector3(cx, 1.2, cz), theta: 0.08, phi: 1.34, r: clamp(Math.max(needH, needV) + (b.maxZ - b.minZ) / 2, 3, 20) };
}
function goalForCab(c) {
  const rot = (c.rot || 0) * Math.PI / 180;
  const tn = Math.tan((camera ? camera.fov : 40) * Math.PI / 360), aspect = camera ? camera.aspect : 1.5;
  const v = cabGroups.get(c.id), out = v && v.slide ? v.slide.dist : 0;
  const target = new THREE.Vector3(c.x + Math.sin(rot) * out, 0, c.z + Math.cos(rot) * out);
  if (c.forma === 'caixa') {
    target.y = c.y + c.h * 0.6;
    const r = Math.max((c.w + 0.3) / (2 * tn * aspect), (c.d + c.h + 0.35) / (2 * tn)) + 0.15;
    return { target, theta: rot + 0.1, phi: 0.85, r };
  }
  target.y = c.y + c.h / 2;
  const doorsOut = c.niveis.some(l => l.tipo !== 'gaveta') ? 0.55 : 0.2;
  const needV = (c.h + 0.3) / (2 * tn), needH = (c.w + 0.3) / (2 * tn * aspect);
  return { target, theta: rot + 0.12, phi: c.y > 0 ? 1.5 : 1.43, r: Math.max(needV, needH) + c.d / 2 + doorsOut };
}
// Where the camera looks inside a unit: an open basket's tools on the bench, a compartment with things inside, or nothing special
function focoDe(c, code) {
  if (!camera || !c || !code) return null;
  const v = cabGroups.get(c.id), s = v && v.slots.get(code);
  if (s && s.mesa) return 'mesa:' + code;
  return (c.dentro || {})[baia(code)] ? 'baia:' + baia(code) : null;
}
// A compartment with things inside gets a closer look, so the boxes and the bin labels can be read;
// an open basket gets a view from above of the bench where its tools are laid out
function goalForBay(c, code) {
  const foco = focoDe(c, code); if (!foco) return null;
  const v = cabGroups.get(c.id), tn = Math.tan(camera.fov * Math.PI / 360), rot = (c.rot || 0) * Math.PI / 180;
  if (foco.startsWith('mesa:')) {
    v.group.updateMatrixWorld(true);
    const caixa = new THREE.Box3().setFromObject(v.slots.get(code).mesa), size = caixa.getSize(new THREE.Vector3());
    // seen from above at a slant, the front edge is nearer and looks wider, hence the extra width; on a tall phone
    // screen the ends may be cropped a little rather than everything shrinking (it can still be turned and zoomed)
    const r = Math.max((size.x + 0.45) / (2 * tn * Math.max(camera.aspect, 1)), (size.z + 0.2) / (2 * tn)) + 0.1;
    return { target: caixa.getCenter(new THREE.Vector3()), theta: rot + 0.03, phi: 0.78, r };
  }
  const s = v && v.slots.get(baia(code)); if (!s) return null;
  const p = s.mesh.getWorldPosition(new THREE.Vector3()), prm = s.mesh.geometry.parameters;
  const r = Math.max((prm.height + 0.2) / (2 * tn), (prm.width + 0.2) / (2 * tn * camera.aspect)) + 0.2;
  return { target: p, theta: rot + 0.06, phi: c.y > 0 ? 1.6 : 1.3, r };
}
function flyTo(goal) {
  const from = { target: cam.target.clone(), theta: cam.theta, phi: cam.phi, r: cam.r };
  let dt = goal.theta - from.theta; dt = Math.atan2(Math.sin(dt), Math.cos(dt));
  anim = { from, goal: { ...goal, theta: from.theta + dt }, t0: performance.now(), dur: REDUCED ? 0 : 750 };
}
function updateCamera() {
  const { target, theta, phi, r } = cam;
  camera.position.set(target.x + r * Math.sin(phi) * Math.sin(theta), target.y + r * Math.cos(phi), target.z + r * Math.sin(phi) * Math.cos(theta));
  camera.lookAt(target);
}

let ultimoQuadro = performance.now();
function tick() {
  requestAnimationFrame(tick);
  // same clock as flyTo: the frame timestamp can be older than a click handled in the same frame
  const agora = performance.now(), dt = Math.min(1, (agora - ultimoQuadro) / 1000);
  ultimoQuadro = agora;
  // doors, lids and drawers ease the same at any frame rate: 14% (16% for drawers) of the way every 1/60 s
  const f = 1 - Math.pow(0.86, dt * 60), fg = 1 - Math.pow(0.84, dt * 60);
  if (anim) {
    const k = anim.dur ? clamp((agora - anim.t0) / anim.dur, 0, 1) : 1;
    const e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    cam.target.lerpVectors(anim.from.target, anim.goal.target, e);
    cam.theta = anim.from.theta + (anim.goal.theta - anim.from.theta) * e;
    cam.phi = anim.from.phi + (anim.goal.phi - anim.from.phi) * e;
    cam.r = anim.from.r + (anim.goal.r - anim.from.r) * e;
    if (k >= 1) anim = null;
  }
  cabGroups.forEach(v => {
    // a box under a bench slides out first and only then opens its lid; closing goes the other way
    const slid = !v.slide || Math.abs(v.slide.cur - v.slide.goal) < 0.02 || v.slide.goal === 0;
    v.doors.forEach(dr => { const g = slid ? dr.goal : 0; dr.cur += (g - dr.cur) * f; dr.pivot.rotation[dr.axis] = dr.cur; });
    if (v.slide) {
      const lidShut = v.doors.every(dr => Math.abs(dr.cur) < 0.05);
      if (v.slide.goal > 0 || lidShut) v.slide.cur += (v.slide.goal - v.slide.cur) * f;
      v.slide.obj.position.z = v.slide.cur;
    }
    v.slots.forEach(s => { if (s.drawer) s.drawer.position.z += ((s.goalZ || 0) - s.drawer.position.z) * fg; });
  });
  updateCamera();
  renderer.render(scene, camera);
  placeLabels();
}

// ---------- pointer: orbit, zoom, pick ----------
function bindPointer() {
  const pts = new Map(); let down = null, pinch0 = null;
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    down = { x: e.clientX, y: e.clientY, moved: false };
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), r: cam.r }; }
    anim = null;
  });
  canvas.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) { hoverAt(e); return; }
    const p = pts.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) down.moved = true;
    if (pts.size === 2 && pinch0) {
      const [a, b] = [...pts.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
      cam.r = clamp(pinch0.r * pinch0.d / Math.max(1, d), camLimits.rMin, camLimits.rMax);
    } else if (down && down.moved) {
      cam.theta -= dx * 0.006;
      cam.phi = clamp(cam.phi - dy * 0.005, camLimits.phiMin, camLimits.phiMax);
    }
  });
  const up = e => {
    const wasClick = down && !down.moved && pts.size === 1;
    pts.delete(e.pointerId); if (pts.size < 2) pinch0 = null;
    if (wasClick) pickAt(e);
    if (!pts.size) down = null;
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', e => { pts.delete(e.pointerId); down = null; pinch0 = null; });
  canvas.addEventListener('pointerleave', () => { if (hovered) { hovered = null; paintSlots(); canvas.classList.remove('pointing'); } });
  canvas.addEventListener('wheel', e => { e.preventDefault(); anim = null; cam.r = clamp(cam.r * Math.exp(e.deltaY * 0.0012), camLimits.rMin, camLimits.rMax); }, { passive: false });
}

function hit(e) {
  const r = canvas.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const objs = [];
  cabGroups.forEach(v => v.group.traverse(o => { if (o.isMesh) objs.push(o); }));
  extras.forEach(x => x.traverse(o => { if (o.isMesh) objs.push(o); }));
  const hits = raycaster.intersectObjects(objs, false);
  if (S.view === 'cab') {
    // inside an open cabinet, prefer compartments over the panels and benches in front of them
    const s = hits.find(h => h.object.userData.slot && h.object.userData.cabId === S.cabId);
    if (s) return s.object.userData;
  }
  // otherwise the first thing hit decides, so a bench top does not open the cabinet under it
  const h = hits[0];
  return h && h.object.userData.cabId ? { cabId: h.object.userData.cabId, slot: null } : null;
}
function hoverAt(e) {
  if (!renderer) return;
  const h = hit(e);
  const key = h ? h.cabId + '|' + (h.slot || '') : '';
  const old = hovered ? hovered.cabId + '|' + (hovered.slot || '') : '';
  if (key !== old) { hovered = h; paintSlots(); }
  canvas.classList.toggle('pointing', !!h && (S.view === 'lab' || !!h.slot || h.cabId !== S.cabId));
}
function pickAt(e) {
  const h = hit(e);
  if (!h) return;
  if (S.view === 'lab' || h.cabId !== S.cabId) openCab(h.cabId);
  else if (h.slot) openSlot(h.slot);
}

// Floating labels: cabinet numbers in the lab view, compartment codes and counts inside a cabinet
const labelEls = new Map();
function placeLabels() {
  const host = $('#labels');
  const r = canvas.getBoundingClientRect();
  const want = new Map();
  if (S.view === 'lab') {
    S.cabs.forEach(c => {
      const v = cabGroups.get(c.id); if (!v) return;
      const n = itemsIn(c.id).length, hov = hovered && hovered.cabId === c.id;
      const base = c.forma === 'caixa' || c.y > 0 || c.rodinhas ? 0 : 0.12;
      const p = c.forma === 'caixa' ? new THREE.Vector3(0, c.h + 0.1, 0) : new THREE.Vector3(0, base + (c.h - base) * 0.55, c.d / 2 + 0.04);
      v.group.localToWorld(p);
      want.set('c' + c.id, { cls: 'lbl cab' + (hov ? ' on' : ''), pos: p,
        html: esc(hov ? cabName(c) : c.numero) + (S.loaded && (n || hov) ? '<small>' + itensTxt(n) + '</small>' : '') });
    });
  } else {
    const c = cabById(S.cabId), v = cabGroups.get(S.cabId);
    const aberta = baia(S.slot), sobre = hovered && hovered.cabId === S.cabId ? hovered.slot : null;
    if (c && v) v.slots.forEach((s, code) => {
      // bins get labels while their compartment is selected (or under the mouse), and then the compartment's own label steps aside
      if (s.parent ? s.parent !== aberta && code !== sobre : code === aberta && v.comCaixinhas.has(code)) return;
      const n = itemsIn(c.id, code).length;
      const nome = s.tipo === 'cesto' ? 'Cesto' : s.parent ? code.split('-')[1] : code;
      // drawer labels follow the drawer out; box labels live in the part that slides out from under the bench
      const p = s.lbl.clone(); if (s.drawer) p.z += s.drawer.position.z;
      (s.drawer ? v.group : s.mesh.parent).localToWorld(p);
      want.set('s' + code, { cls: 'lbl' + (s.parent ? ' bin' : '') + (n ? ' full' : '') + (S.slot === code ? ' on' : ''), html: esc(nome) + (n ? ' · <span class="n">' + n + '</span>' : ''), pos: p });
      // the tools of an open basket, named on the bench
      if (s.mesa && s.mesa.visible) s.mesa.children.forEach((o, i) => {
        if (o.userData.rotulo) want.set('m' + code + i, { cls: 'lbl bin', html: esc(o.userData.rotulo.texto), pos: s.mesa.localToWorld(o.userData.rotulo.pos.clone()) });
      });
    });
  }
  labelEls.forEach((el, k) => { if (!want.has(k)) { el.remove(); labelEls.delete(k); } });
  const ocupados = [];
  want.forEach((w, k) => {
    let el = labelEls.get(k);
    if (!el) { el = document.createElement('div'); host.appendChild(el); labelEls.set(k, el); }
    if (el.className !== w.cls) el.className = w.cls;
    if (el._h !== w.html) { el.innerHTML = w.html; el._h = w.html; }
    const p = w.pos.clone().project(camera);
    const vis = p.z < 1 && p.x > -1.1 && p.x < 1.1 && p.y > -1.1 && p.y < 1.1;
    el.hidden = !vis;
    if (!vis) return;
    const x = (p.x + 1) / 2 * r.width;
    let y = (1 - p.y) / 2 * r.height;
    // the tools on the bench lie close together: a label that would cover another one moves up or down a little,
    // and one with no free spot nearby stays hidden (the list in the panel has every name)
    if (k[0] === 'm') {
      const lw = el.offsetWidth, lh = el.offsetHeight, bate = () => ocupados.some(b => Math.abs(b.x - x) < (b.w + lw) / 2 && Math.abs(b.y - y) < (b.h + lh) / 2);
      for (let t = 0; t < 6 && bate(); t++) y += (t % 2 ? -1 : 1) * (t + 1) * lh * 0.6;
      if (bate()) { el.hidden = true; return; }
      ocupados.push({ x, y, w: lw, h: lh });
    }
    el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%,-50%)`;
  });
}

// ---------- navigation ----------
// O endereço guarda onde a pessoa está (#G6A, #P3C-1), para dar para mandar o link ou gerar um QR code da gaveta.
function setHash() {
  const c = S.view === 'cab' ? cabById(S.cabId) : null;
  const h = c ? '#' + fullCode(c, S.slot) : '';   // #A3 or #P3C-1
  if (location.hash !== h) history.replaceState(null, '', h || location.pathname + location.search);
}
const HINT_LAB = 'Arraste para girar · role para aproximar · clique num armário';
function openLab() {
  S.view = 'lab'; S.cabId = null; S.slot = null;
  camLimits = { rMin: 1.5, rMax: 20, phiMin: 0.25, phiMax: 1.5 };
  if (camera) flyTo(goalForLab());
  applyOpenState(); paintSlots(); renderSheet(); renderCrumbs(); setHash();
  $('#hint').textContent = HINT_LAB;
  $('#closeCab').hidden = true;
}
function openCab(id, slot) {
  const c = cabById(id); if (!c) return;
  S.view = 'cab'; S.cabId = id; S.slot = slot || null;
  camLimits = { rMin: 0.4, rMax: 8, phiMin: 0.3, phiMax: 1.62 };
  if (camera) flyTo(goalForBay(c, S.slot) || goalForCab(c));
  applyOpenState(); paintSlots(); renderSheet(); renderCrumbs(); setHash(); dicaCab(c);
  // "Fechar armário", "Fechar gaveteiro", "Fechar maleta"…: o nome sai da primeira palavra do tipo
  $('#closeCab span').textContent = 'Fechar ' + c.tipo.split(' ')[0].toLowerCase();
  $('#closeCab').hidden = false;
}
function dicaCab(c) {
  $('#hint').textContent = focoDe(c, S.slot) === 'mesa:' + S.slot ? 'As coisas do cesto estão na bancada. Clique no cesto de novo para guardar.'
    : c.forma === 'caixa' ? 'Clique num compartimento para ver o que tem nele' : 'Clique numa gaveta ou prateleira para ver o que tem nela';
}
function openSlot(code) {
  const c = cabById(S.cabId), antes = focoDe(c, S.slot);
  S.slot = S.slot === code ? null : code;
  // the camera moves only when going into or out of a compartment that has things inside, or to an open basket's tools
  const depois = focoDe(c, S.slot);
  if (antes !== depois) flyTo(goalForBay(c, S.slot) || goalForCab(c));
  dicaCab(c);
  applyOpenState(); paintSlots(); renderSheet(); renderCrumbs(); setHash();
}
$('#resetView').addEventListener('click', () => {
  if (!camera) return;
  const c = S.view === 'cab' ? cabById(S.cabId) : null;
  flyTo(c ? goalForBay(c, S.slot) || goalForCab(c) : goalForLab());
});
// Fechar volta para o laboratório: as portas fecham e a câmera se afasta. Esc faz o mesmo, fora da busca.
$('#closeCab').addEventListener('click', openLab);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.view === 'cab' && !e.target.closest('input')) openLab(); });

function renderCrumbs() {
  const el = $('#crumbs');

$('#crumbs').addEventListener('click', e => {

// comLocal shows which bin the item is in, when the list is of a whole compartment

// The bins of a compartment drawn as they stand: one column per stack, top to bottom

// What the model shows inside a compartment, so it is useful even before the stock sheet lists it; a basket opens from here

// Aviso de quando o estoque ainda não foi lido. Os móveis aparecem de qualquer jeito, porque vêm do site.

const hora = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
function foot() {

function renderSheet() {
  const el = $('#sheet');
  if (S.view === 'lab') {
    if (!S.cabs.length) {
      el.innerHTML = '<h2>Nenhum armário cadastrado</h2><p class="muted">Os móveis do modelo ficam no arquivo laboratorio.js do site.</p>' + foot();
      return;
    }
    const total = S.items.length;
    const semCab = S.items.filter(i => !i.cab);
    el.innerHTML = '<div><h2>Laboratório</h2><p class="muted small">' + S.cabs.length + ' móveis' + (S.loaded ? ' · ' + total + (total === 1 ? ' item cadastrado' : ' itens cadastrados') : '') + '</p></div>' +
      avisoEstoque() +
      '<div class="cablist">' + S.cabs.map(c => {
        const n = itemsIn(c.id).length;
        return '<button class="cabrow" type="button" data-cab="' + esc(c.id) + '"><span class="num' + (c.forma === 'caixa' ? ' box' : '') + '">' + esc(c.numero) + '</span><span><b>' + esc(cabName(c)) + '</b><br><span class="small muted">' + esc(c.tipo) + ' · ' + slotsOf(c).filter(s => !s.parent).length + ' compartimentos</span></span><span class="cnt">' + (S.loaded ? itensTxt(n) : '') + '</span></button>';
      }).join('') + '</div>' +
      '<p class="small muted">Clique num armário, no modelo ou na lista, para abrir as portas.</p>' +
      (semCab.length ? '<div class="loose"><h3>Sem armário no modelo</h3><p class="small muted">A coluna Armário destes itens não bate com nenhum móvel do modelo.</p><ul class="items">' + semCab.map(itemCard).join('') + '</ul></div>' : '') +
      foot();
    return;
  }

  const c = cabById(S.cabId);
  if (!c) { openLab(); return; }
  const sl = slotsOf(c);
  const codes = new Set(sl.map(s => s.code));
  const loose = itemsIn(c.id).filter(i => !codes.has(i.local));
  const nBins = sl.filter(s => s.tipo === 'caixinha').length, nCestos = sl.filter(s => s.tipo === 'cesto').length;
  const extras = [nBins && nBins + (nBins === 1 ? ' caixinha' : ' caixinhas'), nCestos && nCestos + (nCestos === 1 ? ' cesto' : ' cestos')].filter(Boolean);
  let html = '<div><h2>' + esc(cabName(c)) + '</h2><p class="small muted">' + esc(c.tipo) + ' · ' + sl.filter(s => !s.parent).length + ' compartimentos' +
    (extras.length ? ', ' + extras.join(' e ') : '') + (S.loaded ? ' · ' + itensTxt(itemsIn(c.id).length) : '') + '</p></div>';
  html += avisoEstoque();
  html += '<div><h3 style="margin-bottom:8px">' + (c.forma === 'caixa' ? 'Vista de cima, do fundo para a frente' : 'Frente do móvel') + '</h3>' + frontGrid(c) + '</div>';

  if (S.slot) {
    const s = sl.find(x => x.code === S.slot);
    const list = itemsIn(c.id, S.slot).sort((a, b) => String(a.item).localeCompare(String(b.item), 'pt'));
    html += binWall(c, baia(S.slot));
    html += '<div style="display:grid;gap:10px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="code">' + esc(fullCode(c, S.slot)) + '</span><b>' + esc(s ? s.label : S.slot) + '</b></div>';
    if (s && s.tipo === 'cesto') html += naBancada(s.conteudo);
    else if (s && s.parent) html += '<p class="small muted">' + (s.etiqueta ? 'Etiqueta: <b>' + esc(s.etiqueta) + '</b>' : 'A etiqueta desta caixinha ainda não está no modelo.') + '</p>';
    else html += noModelo(c, S.slot);
    if (!S.loaded) html += '<div class="empty"><span>Ainda não consegui ler o estoque, então não sei o que tem aqui.</span></div>';
    else if (!list.length) html += '<div class="empty"><span>Nada cadastrado aqui ainda.</span><span class="small">Para cadastrar, escreva na aba Estoque da planilha: Armário <b>' + esc(c.id) + '</b> e Local no armário <b>' + esc(S.slot) + '</b>.</span></div>';
    else html += '<ul class="items">' + list.map(i => itemCard(i, i.local !== S.slot)).join('') + '</ul>';
    html += '</div>';
  } else {
    html += '<p class="muted">Escolha ' + (c.forma === 'caixa' ? 'um compartimento' : 'uma gaveta ou prateleira') + ', no modelo ou no desenho acima, para ver o que tem ' + (c.forma === 'caixa' ? 'nele' : 'nela') + '.</p>';
  }
  if (loose.length) {
    html += '<div class="loose"><h3>Sem compartimento no modelo</h3><p class="small muted">O Local no armário destes itens não existe neste móvel. Corrija na planilha.</p><ul class="items">' + loose.map(itemCard).join('') + '</ul></div>';
  }
  el.innerHTML = html + foot();
}

$('#sheet').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.cab) return openCab(b.dataset.cab);
  if (b.dataset.slot) return openSlot(b.dataset.slot);
  if (b.dataset.act === 'reload') { b.disabled = true; b.textContent = 'Lendo…'; carregar(); }
});

// ---------- search ----------
$('#q').addEventListener('input', () => {
  const q = norm($('#q').value); const box = $('#results');
  if (!q) { box.hidden = true; return; }
  const hits = S.items.filter(i => norm([i.item, i.espec, i.categoria, i.obs, i.origem].join(' ')).includes(q)).slice(0, 30);
  // the model itself answers too: bin labels and the things drawn inside the compartments
  const modelo = new Map();
  S.cabs.forEach(c => {
    slotsOf(c).forEach(s => {
      if (s.tipo === 'caixinha' && s.etiqueta && norm(s.etiqueta).includes(q)) modelo.set(s.code + s.etiqueta, { c, code: s.code, nome: s.etiqueta, onde: 'etiqueta da caixinha' });
      (s.conteudo || []).forEach(n => { if (norm(n).includes(q)) modelo.set(s.code + n, { c, code: s.code, nome: n, onde: 'no ' + s.short.toLowerCase() }); });
    });
    // what is drawn inside the compartments; a basket opens as its own compartment
    Object.keys(c.dentro || {}).forEach(code => recipientes(c, code).forEach(r => {
      const o = r.o, alvo = r.cesto ? r.cesto.code : code;
      if (o.nome && norm(o.nome + ' ' + o.texto + ' ' + o.etiqueta).includes(q)) modelo.set(alvo + o.nome, { c, code: alvo, nome: o.nome, onde: 'no modelo' });
    }));
  });
  const doModelo = [...modelo.values()].slice(0, 20);
  box.innerHTML = hits.map(i => {
    const c = cabById(i.cab);
    return '<button type="button" data-id="' + esc(i.id) + '"><span>' + esc(i.item) + (i.espec ? ' <span class="muted small">' + esc(i.espec) + '</span>' : '') + '</span><span class="code">' + esc(c ? fullCode(c, i.local) : '?') + '</span></button>';
  }).join('') + doModelo.map(m => '<button type="button" data-cab="' + esc(m.c.id) + '" data-slot="' + esc(m.code) + '"><span>' + esc(m.nome) + ' <span class="muted small">' + m.onde + '</span></span><span class="code">' + esc(m.code) + '</span></button>').join('') ||
    '<div class="none">' + (S.loaded ? 'Nenhum item com “' + esc($('#q').value.trim()) + '”.' : 'Nada com “' + esc($('#q').value.trim()) + '” no modelo, e o estoque ainda não foi lido.') + '</div>';
  box.hidden = false;
});
$('#results').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const it = b.dataset.id ? S.items.find(i => i.id === b.dataset.id) : null;
  const cab = it ? it.cab : b.dataset.cab, slot = it ? it.local : b.dataset.slot;
  $('#results').hidden = true; $('#q').value = '';
  if (cabById(cab)) openCab(cab, slot);
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#results').hidden = true; });
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape') { $('#results').hidden = true; $('#q').blur(); } });

// ---------- theme ----------
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rebuildScene);
new MutationObserver(rebuildScene).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------- leitura do estoque ----------
// Lê a aba pelo endpoint gviz do Google em JSONP, que funciona em qualquer site estático sem chave de API.
// Se a planilha não estiver aberta para leitura, o Google devolve uma página de login: o navegador recusa ela como
// script (dispara onerror) ou roda sem chamar o callback (onload). Os dois casos contam como planilha fechada, a não ser sem internet.
let seq = 0;
function lerAba(nome) {
  return new Promise((resolve, reject) => {
    const cb = '__neon_' + norm(nome).replace(/[^a-z]/g, '') + '_' + (++seq);
    const s = document.createElement('script');
    let feito = false;
    const fim = () => { feito = true; delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { fim(); reject('rede'); }, 20000);
    window[cb] = resp => {
      fim();
      if (!resp || resp.status === 'error') return reject('privada');
      resolve(linhas(resp.table));
    };
    s.onload = () => { if (!feito) { fim(); reject('privada'); } };
    s.onerror = () => { if (!feito) { fim(); reject(navigator.onLine === false ? 'rede' : 'privada'); } };
    s.src = 'https://docs.google.com/spreadsheets/d/' + PLANILHA_ID + '/gviz/tq?tqx=responseHandler:' + cb + '&headers=1&sheet=' + encodeURIComponent(nome);
    document.head.appendChild(s);
  });
}
// Converte a tabela do gviz em objetos {cabeçalho normalizado: valor}
function linhas(t) {
  const keys = t.cols.map(c => norm(c.label).replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim());
  return (t.rows || []).map(r => {
    const o = {};
    keys.forEach((k, i) => {
      const c = r.c && r.c[i];
      let v = '';
      if (c) {
        if (typeof c.v === 'number') v = c.v;
        else if (typeof c.v === 'string' && /^Date\(/.test(c.v)) v = c.f || '';
        else if (c.v != null) v = String(c.v).trim();
        else if (c.f != null) v = String(c.f).trim();
      }
      o[k] = v;
    });
    return o;
  });
}
// pega a coluna pelo começo do nome, para "Qtd." valer como "qtd"
const get = (r, prefixo) => { for (const k in r) if (k.startsWith(prefixo)) return r[k]; return ''; };

function montarItens(rows) {
  const porChave = new Map(S.cabs.map(c => [c.key, c.id]));
  return rows.filter(r => txt(get(r, 'item'))).map((r, i) => {
    const q = get(r, 'qtd');
    // "P3C 1", "P3C.1" e "P3C1" viram a caixinha P3C-1
    const local = txt(get(r, 'local')).toUpperCase().replace(/\s+/g, '').replace(/^([PGC]\d+[A-Z])[._/]?(\d+)$/, '$1-$2');
    // sem Armário, o número do código diz qual é o móvel
    const arm = txt(get(r, 'armario')), doLocal = /^[PGC](\d+)/.exec(local);
    return { id: 'i' + i, armario: arm, cab: porChave.get(chave(arm)) || (!arm && doLocal ? porChave.get('n' + +doLocal[1]) : null) || null,
      local, item: txt(get(r, 'item')), espec: txt(get(r, 'especificacao')),
      qtd: q === '' ? '' : (typeof q === 'number' ? q.toLocaleString('pt-BR') : txt(q)), unid: txt(get(r, 'unid')),
      classificacao: txt(get(r, 'classificacao')), categoria: txt(get(r, 'categoria')), estado: txt(get(r, 'estado')),
      origem: txt(get(r, 'projeto')), conferido: txt(get(r, 'conferido')), obs: txt(get(r, 'observacoes')) };
  });
}

// #A3 abre o Armário 3 e #P3C-1 abre a caixinha 1 da P3C; o número do código diz qual é o móvel
function fromHash() {
  const h = decodeURIComponent((location.hash || '').slice(1)).toUpperCase().replace(/\s+/g, '');
  const m = /^A(\d+)$/.exec(h) || /^(?:A(\d+)-)?([PGC](\d+)[A-Z]?(?:-\d+)?)$/.exec(h);
  if (!m) return null;
  const c = S.cabs.find(x => x.numero === String(+(m[1] || m[3])));
  if (!c) return null;
  return { cabId: c.id, slot: m[2] && slotsOf(c).some(s => s.code === m[2]) ? m[2] : null };
}
window.addEventListener('hashchange', () => { const h = fromHash(); if (h) openCab(h.cabId, h.slot); });

let carregando = false;
async function carregar() {
  if (carregando) return;
  carregando = true;
  try {
    const items = montarItens(await lerAba(ABA_ESTOQUE));
    const isig = JSON.stringify(items);
    const mudou = isig !== S.itemsSig || !S.loaded || !!S.erro;
    S.items = items; S.itemsSig = isig; S.erro = null; S.lidoEm = new Date(); S.loaded = true;
    if (mudou) {
      if (S.slot && S.view === 'cab' && !slotsOf(cabById(S.cabId)).some(s => s.code === S.slot)) S.slot = null;
      paintSlots(); renderSheet(); renderCrumbs();
    } else {
      // nada mudou: só troca o rodapé, para não perder a rolagem do painel
      const f = document.querySelector('#sheet .foot'); if (f) f.outerHTML = foot();
    }
  } catch (err) {
    S.erro = err === 'privada' ? 'privada' : 'rede';
    renderSheet();
  } finally {
    carregando = false;
  }
}

Object.assign(S, montarLab(window.LABORATORIO || {}));
init3D();
rebuildScene();
const h0 = fromHash();
if (h0) openCab(h0.cabId, h0.slot);
else { if (camera) { const g = goalForLab(); Object.assign(cam, { theta: g.theta, phi: g.phi, r: g.r }); cam.target.copy(g.target); } openLab(); }
carregar();
setInterval(() => { if (!document.hidden) carregar(); }, ATUALIZA_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.lidoEm && Date.now() - S.lidoEm > 15000) carregar(); });
})();
</script>
